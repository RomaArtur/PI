name: Deploy AlwaysData

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-alwaysdata-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          ALWAYSDATA_FTP_HOST: ${{ secrets.ALWAYSDATA_FTP_HOST }}
          ALWAYSDATA_FTP_USER: ${{ secrets.ALWAYSDATA_FTP_USER }}
          ALWAYSDATA_FTP_PASSWORD: ${{ secrets.ALWAYSDATA_FTP_PASSWORD }}
          ALWAYSDATA_REMOTE_PATH: ${{ secrets.ALWAYSDATA_REMOTE_PATH }}
          ALWAYSDATA_SITE_ID: ${{ secrets.ALWAYSDATA_SITE_ID }}
          ALWAYSDATA_ACCOUNT: ${{ secrets.ALWAYSDATA_ACCOUNT }}
          ALWAYSDATA_API_TOKEN: ${{ secrets.ALWAYSDATA_API_TOKEN }}
        run: |
          set -euo pipefail
          required=(
            ALWAYSDATA_FTP_HOST
            ALWAYSDATA_FTP_USER
            ALWAYSDATA_FTP_PASSWORD
            ALWAYSDATA_REMOTE_PATH
            ALWAYSDATA_SITE_ID
            ALWAYSDATA_ACCOUNT
            ALWAYSDATA_API_TOKEN
          )
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Secret ausente: $key" >&2
              exit 1
            fi
          done

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Sync project via FTP
        env:
          ALWAYSDATA_FTP_HOST: ${{ secrets.ALWAYSDATA_FTP_HOST }}
          ALWAYSDATA_FTP_USER: ${{ secrets.ALWAYSDATA_FTP_USER }}
          ALWAYSDATA_FTP_PASSWORD: ${{ secrets.ALWAYSDATA_FTP_PASSWORD }}
          ALWAYSDATA_REMOTE_PATH: ${{ secrets.ALWAYSDATA_REMOTE_PATH }}
          ALWAYSDATA_FTP_PROTOCOL: ${{ secrets.ALWAYSDATA_FTP_PROTOCOL }}
        run: |
          set -euo pipefail
          protocol="${ALWAYSDATA_FTP_PROTOCOL:-ftp}"
          lftp -u "$ALWAYSDATA_FTP_USER","$ALWAYSDATA_FTP_PASSWORD" "$protocol://$ALWAYSDATA_FTP_HOST" <<EOF
          set ssl:verify-certificate no
          set ftp:passive-mode true
          mirror -R ./ "$ALWAYSDATA_REMOTE_PATH" \
            --delete \
            --verbose \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob node_modules/ \
            --exclude-glob uploads/ \
            --exclude-glob Desktop.ini
          bye
          EOF

      - name: Restart AlwaysData site
        env:
          ALWAYSDATA_SITE_ID: ${{ secrets.ALWAYSDATA_SITE_ID }}
          ALWAYSDATA_ACCOUNT: ${{ secrets.ALWAYSDATA_ACCOUNT }}
          ALWAYSDATA_API_TOKEN: ${{ secrets.ALWAYSDATA_API_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request POST \
            --basic \
            --user "${ALWAYSDATA_API_TOKEN} account=${ALWAYSDATA_ACCOUNT}:" \
            "https://api.alwaysdata.com/v1/site/${ALWAYSDATA_SITE_ID}/restart/"

      - name: Deployment summary
        env:
          ALWAYSDATA_REMOTE_PATH: ${{ secrets.ALWAYSDATA_REMOTE_PATH }}
        run: |
          {
            echo "## Deploy concluido"
            echo ""
            echo "- Destino: \`${ALWAYSDATA_REMOTE_PATH}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
