<svg width="1400" height="980" viewBox="0 0 1400 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgTree" x1="120" y1="60" x2="1280" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7EE"/>
      <stop offset="1" stop-color="#F3ECFF"/>
    </linearGradient>
    <linearGradient id="frontendCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFDFB"/>
      <stop offset="1" stop-color="#FFEEDB"/>
    </linearGradient>
    <linearGradient id="backendCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFDFE"/>
      <stop offset="1" stop-color="#F0E8FF"/>
    </linearGradient>
    <linearGradient id="postmanCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF2E3"/>
    </linearGradient>
    <filter id="shadowTree" x="0" y="0" width="1400" height="980" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#4E2D63" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1400" height="980" rx="40" fill="url(#bgTree)"/>
  <text x="700" y="90" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#251B37">
    Arvore bonita do projeto
  </text>
  <text x="700" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#6D6483">
    Organizacao geral do sistema sem precisar mostrar a arvore crua do terminal
  </text>

  <g filter="url(#shadowTree)">
    <rect x="70" y="190" width="390" height="690" rx="30" fill="url(#frontendCard)" stroke="#F2C89F"/>
    <rect x="505" y="190" width="390" height="690" rx="30" fill="url(#backendCard)" stroke="#D6B6F4"/>
    <rect x="940" y="190" width="390" height="690" rx="30" fill="url(#postmanCard)" stroke="#F2C89F"/>
  </g>

  <text x="265" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#251B37">
    Frontend
  </text>
  <text x="265" y="284" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#6D6483">
    O que o usuario ve e interage
  </text>

  <text x="700" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#251B37">
    Backend
  </text>
  <text x="700" y="284" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#6D6483">
    Onde ficam as regras, rotas e dados
  </text>

  <text x="1135" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#251B37">
    Testes e apoio
  </text>
  <text x="1135" y="284" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#6D6483">
    O que ajuda a validar e manter o projeto
  </text>

  <g font-family="Consolas, Segoe UI Mono, monospace" font-size="22" fill="#4B4360">
    <text x="120" y="350">frontend/</text>
    <text x="152" y="395">assets/</text>
    <text x="152" y="440">css/</text>
    <text x="184" y="480">global.css</text>
    <text x="184" y="515">landing.css</text>
    <text x="184" y="550">dashboard.css</text>
    <text x="152" y="600">js/</text>
    <text x="184" y="640">api/ client.js</text>
    <text x="184" y="675">components/</text>
    <text x="184" y="710">pages/ index, login, dashboard</text>
    <text x="152" y="760">index.html</text>
    <text x="152" y="800">dashboard.html</text>
    <text x="152" y="840">login.html</text>
  </g>

  <g font-family="Consolas, Segoe UI Mono, monospace" font-size="22" fill="#4B4360">
    <text x="555" y="350">backend/</text>
    <text x="587" y="395">src/</text>
    <text x="619" y="435">config/ db.js</text>
    <text x="619" y="475">controllers/</text>
    <text x="651" y="515">Auth, Lead, Produto, Midia, Vendedor</text>
    <text x="619" y="560">middlewares/</text>
    <text x="651" y="600">auth e validacao</text>
    <text x="619" y="645">models/</text>
    <text x="651" y="685">Lead, Produto, MediaAsset, Vendedor</text>
    <text x="619" y="730">routes/</text>
    <text x="651" y="770">login, leads, produtos, media, vendedores</text>
    <text x="619" y="815">utils/ uploads.js</text>
    <text x="619" y="855">server.js</text>
  </g>

  <g font-family="Consolas, Segoe UI Mono, monospace" font-size="22" fill="#4B4360">
    <text x="990" y="350">postman/</text>
    <text x="1022" y="395">PI.postman_collection.json</text>
    <text x="1022" y="440">PI.local.postman_environment.json</text>
    <text x="1022" y="485">PI.producao.postman_environment.json</text>
    <text x="1022" y="545">collections/</text>
    <text x="1054" y="590">Health</text>
    <text x="1054" y="630">Auth</text>
    <text x="1054" y="670">Produtos</text>
    <text x="1054" y="710">Midia</text>
    <text x="1054" y="750">Leads</text>
    <text x="1054" y="790">Vendedores</text>
    <text x="1022" y="850">uploads/ para imagens do sistema</text>
  </g>

  <text x="700" y="930" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#8F4AA1">
    Ideia central: frontend mostra, backend processa, Postman testa e uploads guardam as imagens.
  </text>
</svg>
